<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Loué App — Récapitulatif des notes de réunion</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Loué App">
<meta name="theme-color" content="#1A2B4A">
<link rel="stylesheet" href="commun/style.css?v=da1c66bf9e">
<link rel="stylesheet" href="commun/fiche.css?v=da1c66bf9e">
<style>
[hidden]{display:none!important;}
.rn-carte{background:var(--card);border:1px solid var(--border);border-left:5px solid #0D7A6B;border-radius:var(--rl);padding:12px 14px;margin-bottom:12px;}
.rn-date{font-size:17px;font-weight:800;color:var(--navy,#1A2B4A);line-height:1.3;overflow-wrap:anywhere;}
.rn-auteur{font-size:13px;color:var(--muted);margin-top:2px;}
.rn-texte{font-size:17px;line-height:1.5;margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere;}
.rn-sans{font-size:15px;color:var(--muted);font-style:italic;margin-top:8px;}
.vide{text-align:center;color:var(--muted);padding:28px 10px;font-size:17px;line-height:1.5;}
.vide a{display:inline-block;margin-top:14px;font-size:17px;font-weight:700;}
#info{margin-bottom:10px;}
</style>
</head>
<body>

<div class="topbar no-print">
  <a class="btn btn-secondary btn-petit" href="index.html" aria-label="Retour à l'accueil">‹ Retour</a>
  <span class="tb-name">Récapitulatif</span>
  <span id="loue-envoi-place"></span>
  <button class="btn btn-secondary btn-petit" type="button" id="btn-actualiser" onclick="charger()">↻ Actualiser</button>
</div>

<div class="main">
  <div class="aide" id="entete"></div>
  <div class="listes-info" id="info" role="status"></div>
  <div id="liste"></div>
</div>

<script src="commun/config.js?v=da1c66bf9e"></script>
<script src="commun/api.js?v=da1c66bf9e"></script>
<script src="commun/ui.js?v=da1c66bf9e"></script>
<script src="commun/notes.js?v=da1c66bf9e"></script>
<script src="commun/hors-ligne.js?v=da1c66bf9e"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// Lot 8d — Récapitulatif des notes de réunion d'un chantier : la date et le texte de chaque note, la plus récente en haut.
// Lecture seule. La dernière liste reçue est gardée dans le téléphone (par compte) : elle s'affiche sans réseau.
// Aucun texte n'est inséré comme du HTML : tout passe par textContent.
// ═══════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
let CHANTIER = '';
try { CHANTIER = (new URLSearchParams(location.search).get('chantier') || '').trim().slice(0, 150); } catch (e) {}
let DONNEES = null, DU_TELEPHONE = false, DATE_LISTE = 0, MESSAGE = '', enCours = 0;
let REPONDU = 0;   // numéro de la demande à laquelle le serveur a déjà répondu (même par un refus)

function el(balise, classe, texte) {
  const e = document.createElement(balise);
  if (classe) e.className = classe;
  if (texte !== undefined) e.textContent = texte;
  return e;
}
function heureTexte(ms) {
  const d = new Date(ms), deux = n => String(n).padStart(2, '0');
  return deux(d.getDate()) + '/' + deux(d.getMonth() + 1) + ' à ' + deux(d.getHours()) + ' h ' + deux(d.getMinutes());
}
function vide(texte, avecAccueil) {
  $('liste').textContent = '';
  const v = el('div', 'vide', texte);
  if (avecAccueil) { v.appendChild(document.createElement('br')); const a = el('a', '', 'Aller à l’accueil'); a.href = 'index.html'; v.appendChild(a); }
  $('liste').appendChild(v);
}
function afficher() {
  const notes = (DONNEES && DONNEES.notes) || [];
  $('entete').textContent = 'Notes de réunion — ' + ((DONNEES && DONNEES.chantier) || CHANTIER);
  const lignes = [];
  if (MESSAGE) lignes.push(MESSAGE);
  // « Pas de réseau » seulement quand c'est vrai : après une erreur du serveur, le message d'erreur est déjà affiché
  if (DU_TELEPHONE) lignes.push((MESSAGE ? 'Liste' : 'Pas de réseau : liste') + ' gardée dans le téléphone le ' + heureTexte(DATE_LISTE) + '.');
  else if (notes.length) lignes.push(notes.length + (notes.length > 1 ? ' notes' : ' note') + ', la plus récente en haut.');
  $('info').textContent = lignes.join(' ');
  if (!notes.length) { vide(MESSAGE ? 'Rien à afficher pour l’instant.' : 'Aucune note de réunion pour ce chantier.'); return; }
  $('liste').textContent = '';
  notes.forEach(n => {
    const c = el('div', 'rn-carte');
    c.appendChild(el('div', 'rn-date', 'Réunion du ' + (n.date || '—') + (n.objet ? ' — ' + n.objet : '')));
    if (n.auteur) c.appendChild(el('div', 'rn-auteur', 'Rédigé par ' + n.auteur));
    c.appendChild(n.sansTexte || !n.texte ? el('div', 'rn-sans', 'Le texte de cette note est dans son PDF (dossier du chantier).') : el('div', 'rn-texte', n.texte));
    $('liste').appendChild(c);
  });
}
function charger() {
  const moi = ++enCours;
  if (!CHANTIER) { $('info').textContent = ''; vide('Ouvrez le récapitulatif depuis un chantier.', true); return; }
  if (!LOUE.compte()) { $('info').textContent = ''; vide('Connectez-vous pour voir le récapitulatif.', true); return; }
  $('btn-actualiser').disabled = true;
  if (DONNEES) $('info').textContent = 'Mise à jour…';   // « Actualiser » : on voit qu'il se passe quelque chose
  // La liste gardée dans le téléphone s'affiche TOUT DE SUITE (avec une barre de réseau, le serveur peut mettre 20 secondes)
  if (!DONNEES) {
    $('entete').textContent = 'Notes de réunion — ' + CHANTIER;
    $('info').textContent = 'Chargement…';
    LOUE.notes.recapGarde(CHANTIER).then(g => {
      // le serveur a déjà répondu (un refus peut arriver avant la lecture du téléphone) : la liste gardée n'est plus affichée
      if (moi !== enCours || DONNEES || !g || REPONDU === moi) return;
      DONNEES = g.donnees; DU_TELEPHONE = true; DATE_LISTE = g.date; afficher(); $('info').textContent = 'Mise à jour… (liste gardée dans le téléphone le ' + heureTexte(g.date) + ')';
    });
  }
  LOUE.notes.recap(CHANTIER).then(r => {
    if (moi !== enCours) return;
    REPONDU = moi;
    DONNEES = r.donnees; DU_TELEPHONE = !!r.depuisLeTelephone; DATE_LISTE = r.date; MESSAGE = '';
    afficher();
  }).catch(err => {
    if (moi !== enCours) return;
    REPONDU = moi;
    if (err && err.connexion) { DONNEES = null; $('info').textContent = ''; vide('Session terminée : reconnectez-vous depuis l’accueil.', true); return; }
    if (err && err.code === 'INTERDIT') { DONNEES = null; $('info').textContent = ''; vide('Ce chantier n’est pas dans votre liste.', true); return; }
    MESSAGE = 'Récapitulatif indisponible : ' + String(LOUE.messageClair(err)).replace(/,? nouvel essai automatique/, '').replace(/[.\s]+$/, '') + '.';
    if (DONNEES) { DU_TELEPHONE = true; afficher(); } else { $('info').textContent = MESSAGE; vide('Rien n’est gardé dans le téléphone pour ce chantier. Réessayez avec du réseau.'); }
  }).finally(() => { if (moi === enCours) $('btn-actualiser').disabled = false; });
}
charger();
</script>
</body>
</html>
